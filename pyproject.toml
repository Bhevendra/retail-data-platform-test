[project]
name = "retail-data-platform"
version = "2.0.0"
description = "Databricks lakehouse: Cosmos DB, S3 and SQL Server to a governed Gold star schema"
requires-python = ">=3.10"

[tool.ruff]
line-length = 160
target-version = "py310"
# Notebook sources use Databricks magics and the implicit spark/dbutils globals.
extend-exclude = ["src/*/code", "quality/code", "governance/code", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a Databricks workspace (Delta + Unity Catalog)"]
addopts = "-q -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning"]
