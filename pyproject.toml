[project]
name = "retail-data-platform"
version = "1.0.0"
description = "Config-driven Databricks lakehouse: Cosmos DB, S3 and SQL Server to a governed Gold star schema"
requires-python = ">=3.10"

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["src/**"]  # notebooks (.ipynb) use Databricks magics and implicit spark/dbutils globals

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a Databricks workspace (Delta + Unity Catalog)"]
addopts = "-q -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning"]
