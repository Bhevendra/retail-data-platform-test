bundle:
  name: retail-data-platform

include:
  - resources/*.yml

sync:
  include:
    - src/**
    - common_utils/**

variables:
  catalog:
    description: Unity Catalog catalog for platform data.
    default: retaildataplatform
  secret_scope:
    description: Databricks secret scope containing source credentials.
  alert_email:
    description: Mailbox notified on job failure / SLA breach.
    default: ravidataen@gmail.com
  schedule_pause_status:
    description: PAUSED in non-production targets so only prod runs on the clock.
    default: PAUSED
  run_as_service_principal:
    description: Service principal the production job runs as (empty = deploying user).
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-5cf81efb-3cb1.cloud.databricks.com
    variables:
      secret_scope: retail-platform-dev

  prod:
    mode: production
    workspace:
      host: https://<prod-workspace-url>
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}
    variables:
      secret_scope: retail-platform-prod
      schedule_pause_status: UNPAUSED
    # Uncomment once the production service principal exists:
    # run_as:
    #   service_principal_name: ${var.run_as_service_principal}
