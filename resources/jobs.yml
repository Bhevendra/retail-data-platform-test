resources:
  jobs:
    retail_data_platform:
      name: retail-data-platform-${bundle.target}
      description: >-
        Daily medallion load. Three ingestion tasks land raw extracts in the volume, Bronze
        adds audit columns, three Silver notebooks clean and merge, Gold rebuilds the star
        schema, then quality reports and governance stamps metadata.
      max_concurrent_runs: 1
      timeout_seconds: 7200
      queue:
        enabled: true
      tags:
        application: retail-data-platform
        environment: ${bundle.target}
        owner: data-engineering

      schedule:
        quartz_cron_expression: "0 0 5 * * ?"   # 05:00 UTC, after the overnight source exports
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      email_notifications:
        on_failure: [ "${var.alert_email}" ]
        on_duration_warning_threshold_exceeded: [ "${var.alert_email}" ]
        no_alert_for_skipped_runs: true
      health:
        rules:
          - metric: RUN_DURATION_SECONDS
            op: GREATER_THAN
            value: 3600

      # Job parameters fill the notebook widget of the same name, so a backfill is:
      #   databricks bundle run retail_data_platform -t dev --params run_date=2026-09-01
      parameters:
        - name: run_date
          default: "{{job.start_time.iso_date}}"
        - name: catalog
          default: ${var.catalog}
        - name: bronze_schema
          default: bronze
        - name: silver_schema
          default: silver
        - name: gold_schema
          default: gold
        - name: ops_schema
          default: ops
        - name: raw_volume
          default: raw_data
        - name: secret_scope
          default: ${var.secret_scope}

      # Serverless: Python dependencies are declared once, no cluster libraries.
      environments:
        - environment_key: platform
          spec:
            client: "2"
            dependencies:
              - pymongo==4.10.1
              - boto3==1.35.98
              - databricks-sdk>=0.40.0

      tasks:
        # --- Ingestion: one task per source, all three in parallel -------------------
        - task_key: ingest_sqlserver
          environment_key: platform
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../src/ingestion/code/sqlserver_ingestion.ipynb
            base_parameters:
              config_path: src/ingestion/config/sqlserver_customers.json

        - task_key: ingest_cosmos
          environment_key: platform
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../src/ingestion/code/cosmos_ingestion.ipynb
            base_parameters:
              config_path: src/ingestion/config/cosmos_sales_orders.json

        - task_key: ingest_s3
          environment_key: platform
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../src/ingestion/code/s3_ingestion.ipynb
            base_parameters:
              config_path: src/ingestion/config/s3_sales.json

        # --- Bronze: waits for all three; a partial day must never load silently -----
        - task_key: bronze
          depends_on:
            - task_key: ingest_sqlserver
            - task_key: ingest_cosmos
            - task_key: ingest_s3
          run_if: ALL_SUCCESS
          environment_key: platform
          max_retries: 1
          notebook_task:
            notebook_path: ../src/bronze/code/raw_to_bronze.ipynb

        # --- Silver: one task per source, in parallel --------------------------------
        - task_key: silver_customers
          depends_on: [ { task_key: bronze } ]
          environment_key: platform
          max_retries: 1
          notebook_task:
            notebook_path: ../src/silver/code/customers_silver.ipynb
            base_parameters:
              detect_deletes: "false"

        - task_key: silver_sales_orders
          depends_on: [ { task_key: bronze } ]
          environment_key: platform
          max_retries: 1
          notebook_task:
            notebook_path: ../src/silver/code/sales_orders_silver.ipynb

        - task_key: silver_sales
          depends_on: [ { task_key: bronze } ]
          environment_key: platform
          max_retries: 1
          notebook_task:
            notebook_path: ../src/silver/code/sales_silver.ipynb

        # --- Gold: needs every Silver table ------------------------------------------
        - task_key: gold
          depends_on:
            - task_key: silver_customers
            - task_key: silver_sales_orders
            - task_key: silver_sales
          run_if: ALL_SUCCESS
          environment_key: platform
          max_retries: 1
          notebook_task:
            notebook_path: ../src/gold/code/build_gold.ipynb

        # --- Quality: detect and report. Runs last and never blocks anything ---------
        - task_key: quality
          depends_on: [ { task_key: gold } ]
          environment_key: platform
          notebook_task:
            notebook_path: ../quality/code/run_quality_checks.ipynb
            base_parameters:
              config_path: quality/config/rules.json

        # --- Governance: metadata, independent of the quality outcome ----------------
        - task_key: governance
          depends_on: [ { task_key: gold } ]
          environment_key: platform
          notebook_task:
            notebook_path: ../governance/code/apply_governance.ipynb
            base_parameters:
              config_path: governance/config/tables.json

      permissions:
        - level: CAN_VIEW
          group_name: users
